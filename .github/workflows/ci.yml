name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src/code_analyzer/

      - name: Test with coverage
        run: python -m pytest tests/ -v --cov=code_analyzer --cov-report=xml --cov-report=term-missing

  npm-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Smoke test CLI (wrapper npm)
        run: bash scripts/npm_smoke.sh
