[project]
name = "code-architecture-analyzer"
version = "7.6.0"
description = "Deep Python architecture analysis with automatic refactoring — visible semantic analysis (taint/dataflow/purity) surfaced for AI agents (schema 1.1)."
requires-python = ">=3.8"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["ruff", "black", "isort", "pytest", "pytest-cov"]

[project.scripts]
code-analyze = "code_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# tests/corpus holds analysis FIXTURES (incl. files named test_*.py); they are
# inputs to the accuracy harness, not pytest tests — never collect them.
norecursedirs = ["corpus"]
addopts = "--ignore=tests/corpus --cov=code_analyzer --cov-report=term-missing --cov-fail-under=0"

[tool.ruff]
line-length = 100

[tool.mypy]
mypy_path = ["src"]
ignore_missing_imports = true

[tool.code-analyzer]
max_methods_per_class = 10
max_lines_per_class = 200
max_complexity = 10
max_imports = 20
